name: Terminal release

on:
  push:
    tags:
      - "terminal-v*"

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: terminal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: terminal/package-lock.json
      # The version comes from terminal/package.json and must match the tag (terminal-vX.Y.Z).
      - name: Check tag matches package version
        shell: bash
        run: |
          test "terminal-v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME" \
            || { echo "Tag $GITHUB_REF_NAME does not match terminal/package.json version"; exit 1; }
      - run: npm ci
      - run: npx electron-vite build
      - run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
