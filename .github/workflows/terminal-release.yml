name: Terminal release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  create-draft:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The version comes from terminal/package.json and must match the tag (vX.Y.Z).
      - name: Check tag matches package version
        run: |
          test "v$(node -p "require('./terminal/package.json').version")" = "$GITHUB_REF_NAME" \
            || { echo "Tag $GITHUB_REF_NAME does not match terminal/package.json version"; exit 1; }
      - name: Check tagged commit is on the default branch
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/${{ github.event.repository.default_branch }}
      # One draft up front so the matrix jobs do not race on creating it.
      - name: Create draft release
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" \
                 --notes "POS Kasse $GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"

  build:
    needs: create-draft
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: terminal
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: terminal/package-lock.json
      - run: npm ci
      - run: npx electron-vite build
      - run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - run: gh release edit "$GITHUB_REF_NAME" --draft=false --repo "$GITHUB_REPOSITORY"
