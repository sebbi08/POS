name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Lint commits (pull request)
        if: github.event_name == 'pull_request'
        run: npx commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}"
      - name: Lint commits (push)
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            # New branch: check everything since it diverged from master.
            npx commitlint --from origin/master --to "$GITHUB_SHA"
          else
            npx commitlint --from "$BEFORE" --to "$GITHUB_SHA"
          fi

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
            terminal/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: terminal
      - run: npm test
      - name: Typecheck backend
        run: npx tsc --noEmit
        working-directory: backend
      - name: Build frontend
        run: npm run build
        working-directory: frontend
      - name: Typecheck and build terminal
        run: npx tsc --noEmit && npx electron-vite build
        working-directory: terminal

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build .

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
            terminal/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: terminal
      - name: Start Postgres
        run: |
          docker compose up -d postgres
          for _ in $(seq 1 30); do
            docker compose exec -T postgres pg_isready -U pos && exit 0
            sleep 2
          done
          echo "Postgres did not become ready"
          exit 1
      # Ubuntu 24.04 blocks unprivileged user namespaces, which Electron/Chromium sandboxes need.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npx playwright install --with-deps chromium
      - run: xvfb-run -a npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/
