name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/sebbi08/pos

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      # Versions come from the package.json files and must match the tag (vX.Y.Z).
      - name: Check tag matches package versions
        run: |
          test "v$(node -p "require('./terminal/package.json').version")" = "$GITHUB_REF_NAME" \
            || { echo "Tag $GITHUB_REF_NAME does not match terminal/package.json version"; exit 1; }
          test "v$(node -p "require('./backend/package.json').version")" = "$GITHUB_REF_NAME" \
            || { echo "Tag $GITHUB_REF_NAME does not match backend/package.json version"; exit 1; }
      - name: Check tagged commit is on the default branch
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/${{ github.event.repository.default_branch }}
      - name: Extract release notes from CHANGELOG.md
        run: node scripts/release/release.mjs notes "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
      # One draft up front so the matrix jobs do not race on creating it.
      - name: Create draft release
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" \
              --notes-file "$RUNNER_TEMP/notes.md" --repo "$GITHUB_REPOSITORY"
          fi

  # Installers are uploaded into the draft release, which auto-update cannot see.
  terminal:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: terminal
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: terminal/package-lock.json
      - run: npm ci
      - run: npx electron-vite build
      - run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Build only (no push); layers go to the GHA cache for the publish job.
  image:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-to: type=gha,mode=max

  # Runs only when image and all terminal legs succeeded: image push first, un-draft last.
  publish:
    needs: [verify, terminal, image]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          cache-from: type=gha
          tags: |
            ${{ env.IMAGE }}:${{ needs.verify.outputs.version }}
            ${{ env.IMAGE }}:latest
      - name: Publish GitHub release
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --repo "$GITHUB_REPOSITORY"
